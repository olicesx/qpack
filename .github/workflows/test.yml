on: [ push, pull_request, workflow_dispatch ]

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        go: [ "1.24.x", "1.25.x", "1.26.x" ]
    runs-on: ubuntu-latest
    name: Unit tests (Go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with: 
          go-version: ${{ matrix.go }}
      - run: go version
      - name: Assert fuzz targets are buildable
        # Fail closed: a stale package path in the ClusterFuzzLite build script
        # silently disables fuzzing (the CFL workflow only runs on pull_request).
        run: |
          set -euo pipefail
          mapfile -t targets < <(sed -n 's/.*compile_go_fuzzer[[:space:]]\+\([^[:space:]]*\).*/\1/p' .clusterfuzzlite/build.sh)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::no compile_go_fuzzer target found in .clusterfuzzlite/build.sh"
            exit 1
          fi
          for target in "${targets[@]}"; do
            echo "building fuzz target: ${target}"
            go build "${target}"
          done
      - name: Run example
        run: go run example/main.go
      - name: Run tests
        run: go test -v -cover -coverprofile coverage.txt -race -shuffle=on .
      - name: Run interop tests
        run: go test -shuffle=on -v ./interop
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          GO: ${{ matrix.go }}
        with:
          files: coverage.txt
          env_vars: GO
          token: ${{ secrets.CODECOV_TOKEN }}
